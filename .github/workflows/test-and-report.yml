name: Test and Report to Xray

on:
  push:
    branches: [ version-4, main ]
  pull_request:
    branches: [ version-4, main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
      redis:
        image: redis:alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Tests with Maven
        run: mvn -f api-spring-boot/pom.xml clean verify

      - name: Publish results to Xray
        if: always()
        run: |
          curl -H "Content-Type: multipart/form-data" \
          -H "Authorization: Bearer ${{ secrets.XRAY_TOKEN }}" \
          -F "file=@api-spring-boot/target/surefire-reports/TEST-*.xml" \
          "https://xray.cloud.getxray.app/api/v2/import/execution/junit?projectKey=PROJ"
